# ===================================================================
# IoT-Based Automated Energy Monitoring and Management System
# Backend Application Configuration (Local & Cloud / Render / Aiven)
# ===================================================================

# Server Configuration (Render dynamically injects $PORT; defaults to 8081 locally)
server.port=${PORT:8081}

# Application Name
spring.application.name=smart-energy-monitoring-system

# MySQL Database Configuration (Aiven Cloud or Local MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smart_energy_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

# JWT Authentication
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=86400000

# MQTT Field Gateway (Optional external broker)
app.mqtt.enabled=false
app.mqtt.broker-url=tcp://localhost:1883
app.mqtt.client-id=smart-energy-backend
app.mqtt.topic-filter=smartbuilding/#
app.mqtt.username=
app.mqtt.password=

# IoT Real-Time Simulation Engine
app.simulation.enabled=${SIMULATION_ENABLED:true}
app.simulation.interval-ms=4000
app.simulation.telemetry-fluctuation-pct=12
app.device.offline-threshold-seconds=60

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info,metrics
